[project]
name = "stock-research-api"
version = "0.1.0"
description = "Point-in-time aware momentum research screener"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "psycopg[binary]==3.2.9", "alembic==1.15.2", "pandas==2.2.3",
  "numpy==2.2.5", "httpx==0.28.1", "pydantic-settings==2.9.1",
  "apscheduler==3.11.0", "exchange-calendars==4.10.1",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
