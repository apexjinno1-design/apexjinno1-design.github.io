name: Validate
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: screener
          POSTGRES_PASSWORD: screener
          POSTGRES_DB: stock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U screener -d stock_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.3'
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://screener:screener@127.0.0.1:5432/stock_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
