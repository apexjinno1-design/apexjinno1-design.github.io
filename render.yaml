# Review Render's current pricing before creating these managed services.
services:
  - type: pserv
    name: stock-api
    runtime: docker
    plan: starter
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock-db
          property: connectionString
      - key: MASSIVE_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: INITIAL_REFRESH_ENABLED
        value: "true"
      - key: MASSIVE_REQUESTS_PER_MINUTE
        value: "5"
      - key: INGEST_SYMBOLS
        value: SPY,QQQ,IWM,NVDA,AMD,AAPL,MSFT,META
      - key: PORT
        value: "8000"
  - type: web
    name: stock-web
    runtime: docker
    plan: starter
    region: oregon
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/web-health
    envVars:
      - key: API_HOST
        fromService:
          name: stock-api
          type: pserv
          property: host
      - key: API_PORT
        value: "8000"
      - key: REQUIRE_AUTH
        value: "true"
      - key: SCREENER_USER
        value: research
      - key: SCREENER_PASSWORD
        generateValue: true
databases:
  - name: stock-db
    plan: basic-256mb
    region: oregon
    databaseName: stock
    user: stock
